name: Feature or detector request
description: Support for a framework, library or pattern, or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to understand about a codebase that you can't today?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example code
      description: A short snippet showing the pattern the analyzer should recognise, if relevant.
  - type: textarea
    id: output
    attributes:
      label: What the tool should show
